  <!-- Favicon -->

  <!-- Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->

<body>
  <!-- Persistent Luminous Flow & Silver Silk Wave Background -->
  <div class="bg-wrapper" id="bgWrapper">
    <div class="bg-silk-layer" id="bgSilk"></div>
    <div class="bg-luminous-flow" id="bgLuminous"></div>
    <div class="bg-shimmer-layer"></div>
    <div class="bg-mesh-overlay"></div>
  </div>

  <!-- Separated Floating Island Navigation (4 Distinct Tabs with Icons) -->
  <header class="header" id="header">
    <div class="header-nav-container">
      <nav class="nav-island-group" id="navMenu">
        <a href="index.html" class="nav-pill">
          <svg class="nav-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
        </a>
        <a href="intro.html" class="nav-pill">
          <svg class="nav-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Intro</span>
        </a>
        <a href="skills.html" class="nav-pill">
          <svg class="nav-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Skills</span>
        </a>
        <a href="contact.html" class="nav-pill active">
          <svg class="nav-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <span>Contact</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Left-Aligned Minimalist Text-Only Main Content: CONTACT -->
  <main class="main-content">
    <div class="container page-wrapper contact-wrapper">
      <p class="page-category reveal-1">03 / Reach Out</p>
      
      <h1 class="page-headline reveal-2">Get In Touch.</h1>

      <p class="contact-text-lead reveal-3">
        Available for Discord bot development, minimal web engineering, and digital collaborations.
      </p>

      <div class="contact-direct-list reveal-4">
        <div class="contact-direct-item">
          <span class="contact-label">Email</span>
          <span class="contact-value">
            <span id="emailAddress">wheijgwa@gmail.com</span>
            <button class="inline-copy-btn" id="btnCopyEmail" title="Copy email address">Copy</button>
          </span>
        </div>

        <div class="contact-direct-item">
          <span class="contact-label">Discord</span>
          <span class="contact-value">@mezy310</span>
        </div>

        <div class="contact-direct-item">
          <span class="contact-label">GitHub</span>
          <span class="contact-value">
            <a href="https://github.com/sorajiz" target="_blank" rel="noopener noreferrer">github.com/sorajiz</a>
          </span>
        </div>

        <div class="contact-direct-item">
          <span class="contact-label">Location</span>
          <span class="contact-location">Vietnam • Available Worldwide</span>
        </div>
      </div>
    </div>
  </main>



  <!-- Floating Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>

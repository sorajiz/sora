# ==============================================================================
# OWASP MODSECURITY CORE RULE SET (CRS v4) CONFIGURATION
# Protects against OWASP Top 10, SQLi, XSS, RCE, LFI, and Malicious Scanners
# ==============================================================================

# Enable ModSecurity Engine
SecRuleEngine On

# Request & Response Inspection Bodies
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Anomaly Scoring Thresholds (Default: Inbound=5, Outbound=4)
SecAction \
 "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# Paranoia Level (Level 1: Balanced & Zero False Positives)
SecAction \
 "id:900001,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=1"

# Block Aggressive Scanners, Crawlers, and Vulnerability Probers
SecAction \
 "id:900200,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

# Core Rules Includes (when mounted in ModSecurity container)
# Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
# Include /etc/modsecurity.d/owasp-crs/rules/*.conf

name: CI Pipeline (Build, Test, Security & TruffleHog)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly security audits
    - cron: '0 0 * * 0'

jobs:
  build-and-test:
    name: Build & Server Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Distribution
        run: npm run build

      - name: Run Anti-Security Secret Scan
        run: npm run security:scan

      - name: Run Server & Integration Tests
        run: npm test

  trufflehog-secret-scan:
    name: TruffleHog Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Open Source Secret Scanner
        uses: trufflesecurity/trufflehog@v3.88.15
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  dependency-security-audit:
    name: NPM Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Audit Dependencies
        run: |
          npm audit --audit-level=high
